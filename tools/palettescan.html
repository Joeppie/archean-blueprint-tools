<script type="module">
import { resolveColor } from 'http://127.0.0.1:8650/viewer/palette.js';
const ids = window.__IDS;
const lines = [];
for (const id of ids) {
  try {
    const bp = await (await fetch('http://127.0.0.1:8650/testdata/' + id + '/blueprint.json')).json();
    const d = bp.data;
    const pal = Array.isArray(d.colors) ? d.colors : [];
    const filePal = pal.length > 0;
    const bad = new Map();                     // slot -> count (unresolved)
    const check = (slot) => {
      if (slot == null) return;
      try {
        const c = resolveColor(pal, slot);
        if (c.r === 255 && c.g === 0 && c.b === 255) bad.set(slot, (bad.get(slot) || 0) + 1);
      } catch (e) { bad.set('EXC:' + slot, (bad.get('EXC:' + slot) || 0) + 1); }
    };
    for (const b of d.blocks || [])
      if (b.type !== 255) for (const s of b.colors || []) check(s);
    for (const c of d.components || []) {
      if (Array.isArray(c.colors)) c.colors.forEach(check);
      else if (c.colors && typeof c.colors === 'object')
        for (const k of Object.keys(c.colors)) check(c.colors[k]);
    }
    for (const t of d.triangles || []) for (const s of (t.colors || [])) check(s);
    const n = [...bad.values()].reduce((a, b) => a + b, 0);
    if (n) lines.push(id + ' ' + (filePal ? 'FILEPAL' : 'builtin') + ' x' + n + ': ' +
      [...bad.entries()].map(([s, c]) => s + '(' + c + ')').join(','));
  } catch (e) { lines.push(id + ' FETCHFAIL ' + e.message); }
}
document.getElementById('out').textContent = 'SCAN-DONE ' + lines.length + '\n' + lines.join('\n');
document.title = 'SCAN ' + lines.length;
